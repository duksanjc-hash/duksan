name: Windows EXE 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '생산RAW_변경프로그램.py'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install --upgrade pip pyinstaller openpyxl
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "생산RAW_변경프로그램" "생산RAW_변경프로그램.py"
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 생산RAW_윈도우_EXE
          path: dist/생산RAW_변경프로그램.exe
          if-no-files-found: error
          retention-days: 14
